<html>
<style>
.body1{
  background:linear-gradient(rgb(100, 100, 100), rgb(190, 190, 190));
}
.top_text1{
   font-family:"Segoe UI";
   font-size:29px;
   color:rgb(245, 245, 245);
   position:absolute;
   left:40%;
   top:5%;
 }
.top_image1{
   position:absolute;
   left:20%;
   top:5%;
   width:100px;
   height:100px;
}
.ques_edit1{
   position:absolute;
   left:30%;
   top:20%;
   width:700px;
   height:100px;
   background:rgb(29, 29, 29);
   color:rgb(245, 245, 245);
   border-radius:12px;
}
.ques_edit2{
   position:absolute;
   left:30%;
   top:40%;
   width:700px;
   height:300px;
   background:rgb(29, 29, 29);
   color:rgb(245, 245, 245);
   border-radius:12px;
   overflow-y:scroll;
}
.button_image1{
   position:absolute;
   left:85%;
   top:20%;
   cursor:pointer;
}
</style>
<script src="https://js.puter.com/v2/"></script>
<script>
async function click_3(){

  const prompt_text=document.getElementById("edit1").value;
 const res=await puter.ai.chat(prompt_text, {model:"claude-sonnet-5", normalize:true});
  document.getElementById("edit2").value=res;
}
</script>
<body class="body1">
<h4 class="top_text1">Claude Chat</h4>
<img src="logo.png" class="top_image1"></img>
<textarea class="ques_edit1" id="edit1" placeholder="Ask Anything"></textarea>
<textarea class="ques_edit2" id="edit2" ></textarea>
<button class="button_image1" onclick="click_3()">Submit</button
</body>
</html>
